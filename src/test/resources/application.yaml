#
# Test configuration for heads-of-governments-spring-data: heads_of_governments.sqlite3, a class path resource of the
# heads-of-governments-persistence artifact, opened read-only. No persistence.xml; the entities are scanned.
#
spring:
  datasource:
    # A resource on the test class path. open_mode=1 opens it read-only, and
    # jdbc.explicit_readonly lets Spring's read-only transactions call Connection#setReadOnly, which the driver refuses
    # otherwise once the connection is open.
    url: jdbc:sqlite::resource:heads_of_governments.sqlite3?open_mode=1&jdbc.explicit_readonly=true
    driver-class-name: org.sqlite.JDBC
  jpa:
    # Hibernate's SQLiteDialect, from hibernate-community-dialects.
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # The database is the fixture; nothing here may touch its schema.
      ddl-auto: none
    open-in-view: false
    properties:
      # The SQL, as org.hibernate.SQL logs it, on multiple lines.
      hibernate.format_sql: true

logging:
  level:
    com.github.jinahya: debug
    # The SQL Hibernate runs, and the values bound to its parameters.
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
